<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>绑定目录 · 开发助手</title>
    <link rel="stylesheet" href="dir-window.css">
  </head>
  <body>
    <main class="shell">
      <h1 class="title">绑定当前页面的目录</h1>
      <p class="page-url" id="page-url">读取页面信息...</p>
      <p class="current-dir" id="current-dir" hidden></p>

      <div id="drop-zone" class="drop-zone">
        <p class="drop-title">把文件夹拖到这里</p>
        <p class="drop-hint">Chrome（Windows）的系统对话框可能无法返回所选文件夹，拖入可稳定完成绑定</p>
        <p class="drop-hint">目录归属只记录在扩展本地，不会在目录里新增文件</p>
      </div>

      <div class="actions">
        <button id="picker-btn" class="btn-secondary" type="button">使用系统对话框选择</button>
        <button id="permission-btn" class="btn-primary" type="button" hidden>授予写入权限</button>
      </div>

      <p id="status" class="status" hidden></p>
    </main>

    <script type="module" src="dir-window.js"></script>
  </body>
</html>
